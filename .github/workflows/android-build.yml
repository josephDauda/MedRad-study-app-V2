name: Android Build Verification

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Create CI debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build and run unit tests
        run: |
          for attempt in 1 2 3; do
            bash gradlew --no-configuration-cache testDebugUnitTest assembleDebug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt $attempt failed; retrying after Maven Central rate-limit cooldown..."
              sleep 20
            fi
          done
          exit 1
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medrad-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
