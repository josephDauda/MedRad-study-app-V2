format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

workflows:
  primary:
    summary: Build Android Debug APK
    description: Builds the native Android debug APK and deploys to Bitrise artifacts
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone-repository@1: {}
      - restore-gradle-cache@1: {}
      - script@1:
          title: Setup Gradle Permissions, Java 21 and Keystore
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -e

                # 1. Grant executable permission to Gradle wrapper (fixes permission denied)
                chmod +x ./gradlew

                # 2. Select Java 21 if available on Bitrise VM
                if [ -d "/usr/lib/jvm/java-21-openjdk-amd64" ]; then
                  export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
                  export PATH="$JAVA_HOME/bin:$PATH"
                elif [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
                  export JAVA_HOME="/usr/lib/jvm/temurin-21-jdk-amd64"
                  export PATH="$JAVA_HOME/bin:$PATH"
                fi
                echo "Current Java version:"
                java -version

                # 3. Restore debug.keystore if missing
                if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
                  echo "Restoring debug.keystore from base64..."
                  base64 -d debug.keystore.base64 > debug.keystore
                fi

                # 4. Ensure .env exists (fallback to .env.example)
                if [ ! -f .env ] && [ -f .env.example ]; then
                  echo "Creating .env from .env.example..."
                  cp .env.example .env
                fi

                # 5. Optional Firebase credentials
                if [ -n "$GOOGLE_SERVICES_JSON" ]; then
                  echo "Injecting google-services.json..."
                  echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
                fi
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: ./gradlew
      - android-build@1:
          inputs:
            - project_location: .
            - module: app
            - variant: debug
            - build_type: apk
      - save-gradle-cache@1: {}
      - deploy-to-bitrise-io@2:
          inputs:
            - notify_user_groups: none
            - is_compress: 'true'

  release:
    summary: Build Android Release APK
    description: Builds the native Android release APK and deploys to Bitrise artifacts
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone-repository@1: {}
      - restore-gradle-cache@1: {}
      - script@1:
          title: Setup Gradle Permissions, Java 21 and Keystore
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -e
                chmod +x ./gradlew
                if [ -d "/usr/lib/jvm/java-21-openjdk-amd64" ]; then
                  export JAVA_HOME="/usr/lib/jvm/java-21-openjdk-amd64"
                  export PATH="$JAVA_HOME/bin:$PATH"
                elif [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
                  export JAVA_HOME="/usr/lib/jvm/temurin-21-jdk-amd64"
                  export PATH="$JAVA_HOME/bin:$PATH"
                fi
                if [ ! -f .env ] && [ -f .env.example ]; then
                  cp .env.example .env
                fi
                if [ -n "$GOOGLE_SERVICES_JSON" ]; then
                  echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
                fi
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: ./gradlew
      - android-build@1:
          inputs:
            - project_location: .
            - module: app
            - variant: release
            - build_type: apk
      - save-gradle-cache@1: {}
      - deploy-to-bitrise-io@2:
          inputs:
            - notify_user_groups: none
            - is_compress: 'true'
